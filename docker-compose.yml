# version: '3'
services:
  client:
    build: ./client
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.0.101  # Replace with your machine's IP
    env_file:
      - ./client/.env

  server:
    build: ./server
    ports:
      - "3000:3000"
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/firebase-admin-key.json:/app/firebase-admin-key.json:ro
    environment:
      - NODE_ENV=development
    env_file:
      - ./server/.env

volumes:
  node_modules:
  firebase_admin_key: