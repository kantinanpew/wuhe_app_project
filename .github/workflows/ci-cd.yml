name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v1
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Create client .env file
      run: |
        echo "REACT_APP_FIREBASE_API_KEY=${{ secrets.REACT_APP_FIREBASE_API_KEY }}" > client/.env
        echo "REACT_APP_FIREBASE_AUTH_DOMAIN=${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}" >> client/.env
        echo "REACT_APP_FIREBASE_PROJECT_ID=${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}" >> client/.env
        echo "REACT_APP_FIREBASE_STORAGE_BUCKET=${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}" >> client/.env
        echo "REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}" >> client/.env
        echo "REACT_APP_FIREBASE_APP_ID=${{ secrets.REACT_APP_FIREBASE_APP_ID }}" >> client/.env

    - name: Create server .env file
      run: |
        echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" > server/.env

    - name: Create Firebase Admin Key file
      run: echo '${{ secrets.FIREBASE_ADMIN_KEY }}' > firebase-admin-key.json

    - name: Create Firebase configuration files
      run: |
        echo '{
          "firestore": {
            "rules": "firestore.rules",
            "indexes": "firestore.indexes.json"
          }
        }' > firebase.json
        
        echo '{
          "indexes": []
        }' > firestore.indexes.json
        
        echo 'rules_version = "2";
        service cloud.firestore {
          match /databases/{database}/documents {
            match /{document=**} {
              allow read, write: if false;
            }
          }
        }' > firestore.rules

    - name: Build and push client
      uses: docker/build-push-action@v2
      with:
        context: ./client
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/tea-farm-client:latest

    - name: Build and push server
      uses: docker/build-push-action@v2
      with:
        context: ./server
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/tea-farm-server:latest

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v0.2.0
      with:
        project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
        service_account_key: ${{ secrets.FIREBASE_ADMIN_KEY }}
        export_default_credentials: true

    - name: Verify Google Cloud credentials
      run: |
        gcloud auth list
        gcloud config list project
        gcloud projects describe ${{ secrets.FIREBASE_PROJECT_ID }}

    - name: Deploy to Firebase
      uses: w9jds/firebase-action@master
      with:
        args: deploy --only firestore --project ${{ secrets.FIREBASE_PROJECT_ID }}
      env:
        GCP_SA_KEY: ${{ secrets.FIREBASE_ADMIN_KEY }}

        